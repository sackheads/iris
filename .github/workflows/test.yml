name: Tests

on:
  pull_request:
  push:
    branches: [main]
  # A run by hand (#729), for when a run on main was cancelled and nothing replaced it.
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Whether this run needs the build and tests at all (#535): a change that touches only
    # documentation (Markdown outside Sources/ and Tests/, docs/, the README's images) skips them.
    # A job, not `paths-ignore`, on purpose: a workflow that paths-ignore skips never reports, so a
    # required "test" check would sit pending forever on a docs PR; a job skipped by `if:` reports
    # as skipped, which satisfies one. Anything the script cannot classify runs the tests.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test the classifier
        run: scripts/ci-changes-test.sh

      - name: List the agent-facing strings this change may touch
        # #629: for the reviewer, in the step summary; it decides nothing and never fails the job.
        # Here, not in `test`: this job has the history to diff, and it runs on every change.
        if: github.event_name == 'pull_request'
        continue-on-error: true
        # continue-on-error doesn't cover the job's own 5-minute cap; this keeps it well inside.
        timeout-minutes: 2
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        # The listing first, so it always prints; then its own test, whose failure marks the step.
        run: |
          scripts/agent-strings.sh "$BASE" HEAD
          scripts/agent-strings-test.sh

      - name: Classify the change
        id: classify
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          # #729: a push to main always tests; only a pull request may skip for docs-only changes.
          MAIN_PUSH: ${{ github.event_name == 'push' && '--main-push' || '' }}
        run: scripts/ci-changes.sh $MAIN_PUSH "$BASE" HEAD

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # SwiftPM package only (IrisKit + the `iris` executable + irisTests). The Xcode app target is
    # not built here: it needs the Metal toolchain for MLX's shaders and Developer ID signing,
    # neither of which the runner has. GUI checks (the app, hotkeys, real windows) are not covered.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        id: toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "key=$( { xcodebuild -version; swift --version 2>&1; } | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache .build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ steps.toolchain.outputs.key }}-

      - name: Build package and tests, no warnings in Sources/ or Tests/
        # check-warnings.sh runs `swift build --build-tests` itself, after touching our own Swift
        # files so every warning prints; a separate build step first would compile our modules
        # twice. Dependencies come from the cache and are not rebuilt.
        run: scripts/check-warnings.sh

      - name: Tests
        # Serial on purpose (#486). The runner has 3 cores, so Swift's cooperative pool is 3
        # threads. Every suite passes alone in parallel mode, but the full suite in parallel
        # saturates the pool and about 30 deadline suites (stops, kill ladders, timeouts) miss.
        # No single suite is the hog. See AGENTS.md's CI paragraph for the next step if this slows.
        # `swift test` exits non-zero when either Swift Testing or XCTest fails; the check after
        # it also requires both summary lines, so a run that silently selected nothing fails.
        timeout-minutes: 30
        env:
          NSUnbufferedIO: "YES"
        run: |
          swift test --no-parallel 2>&1 | tee test.log
          grep -E "^✔ Test run with [0-9]+ tests? in [0-9]+ suites? passed" test.log
          # XCTest prints a summary per class and per bundle; the last one is the whole run's.
          grep -E "Executed [0-9]+ tests?, with" test.log | tail -1 | grep -E "Executed [1-9][0-9]* tests?, with 0 failures"
