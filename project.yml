name: Iris
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  iris:
    path: .
targets:
  Iris:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["Info.plist", "Iris.entitlements"]
    dependencies:
      - package: iris
        product: IrisKit
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Iris.entitlements
        PRODUCT_NAME: Iris
        ARCHS: arm64
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: RMKGLPG4K4
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "1"
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.bnaylor.iris.dev
          PRODUCT_NAME: "Iris Dev"
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.bnaylor.iris
schemes:
  Iris:
    build:
      targets:
        Iris: all
    run:
      config: Debug
    archive:
      config: Release
